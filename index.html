<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Minhas Finanças</title>
<meta name="theme-color" content="#1E6B50">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanças">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: coluna única de celular — seletor Pessoal/Mercadorias no topo, caixa do Apple Pay, resumo da área, abas internas e botão fixo de lançar */
:root{
  --bg:#EEF2EE; --surface:#FFFFFF; --sunk:#E3E9E4; --line:#D2DBD4;
  --fg:#16211C; --muted:#5B6B62;
  --acc-p:#1E6B50; --acc-p-soft:#D6EBE1;
  --acc-m:#1F4E79; --acc-m-soft:#D8E4F1;
  --on-acc:#FFFFFF;
  --good:#1E7A4C; --good-soft:#D6EBE1; --warn:#9A5B00; --warn-soft:#FBEBCF; --bad:#B4312A; --bad-soft:#F8DCD9;
  --ap:#111111; --ap-soft:#ECECEC;
  --credito:#5B4BC4; --pix:#0E8C86; --debito:#2F6BB3; --dinheiro:#8A6A1F;
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;
  --f-body:"Figtree",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1512; --surface:#18211C; --sunk:#121A16; --line:#2A362F;
  --fg:#E7EEE9; --muted:#9AAAA1;
  --acc-p:#5FC79D; --acc-p-soft:#1D3A2D;
  --acc-m:#7FB2E5; --acc-m-soft:#1B2C3D;
  --on-acc:#06150E;
  --good:#5FC79D; --good-soft:#1D3A2D; --warn:#E8AA45; --warn-soft:#3A2C12; --bad:#F07A70; --bad-soft:#3F1E1B;
  --ap:#F2F2F2; --ap-soft:#2A2A2A;
  --credito:#A99BFF; --pix:#4CC9C1; --debito:#7DB0F0; --dinheiro:#D9B45A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F1512; --surface:#18211C; --sunk:#121A16; --line:#2A362F;
  --fg:#E7EEE9; --muted:#9AAAA1;
  --acc-p:#5FC79D; --acc-p-soft:#1D3A2D;
  --acc-m:#7FB2E5; --acc-m-soft:#1B2C3D;
  --on-acc:#06150E;
  --good:#5FC79D; --good-soft:#1D3A2D; --warn:#E8AA45; --warn-soft:#3A2C12; --bad:#F07A70; --bad-soft:#3F1E1B;
  --ap:#F2F2F2; --ap-soft:#2A2A2A;
  --credito:#A99BFF; --pix:#4CC9C1; --debito:#7DB0F0; --dinheiro:#D9B45A; color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:15px;line-height:1.45;font-variant-numeric:tabular-nums;
  --accent:var(--acc-p);--accent-soft:var(--acc-p-soft)}
body[data-area="merc"]{--accent:var(--acc-m);--accent-soft:var(--acc-m-soft)}
img{max-width:100%}
[hidden]{display:none!important}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2{font-family:var(--f-display);margin:0;text-wrap:balance}

.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:14px calc(110px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}
.top h1{font-size:1.15rem;font-weight:800;letter-spacing:-.01em}
.top small{display:block;color:var(--muted);font-family:var(--f-body);font-weight:600;font-size:.74rem;letter-spacing:.08em;text-transform:uppercase}
.top-r{display:flex;align-items:center;gap:6px}
.month{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:3px}
.month button{border:0;background:none;width:30px;height:30px;border-radius:50%;font-size:1.1rem}
.month span{min-width:78px;text-align:center;font-weight:700;font-size:.88rem;text-transform:capitalize}
.gear{border:1px solid var(--line);background:var(--surface);width:38px;height:38px;border-radius:50%;display:grid;place-items:center}
.gear svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

.area{display:grid;grid-template-columns:1fr 1fr;background:var(--sunk);border-radius:14px;padding:4px;gap:4px}
.area button{border:0;background:none;padding:10px 6px;border-radius:11px;font-weight:700;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:7px}
.area button i{width:9px;height:9px;border-radius:50%}
.area button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgb(0 0 0/.1)}


.inbox{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ap);background:var(--surface);border-radius:14px;padding:11px 12px;width:100%;text-align:left}
.inbox .ic{width:38px;height:38px;border-radius:10px;background:var(--ap);color:var(--bg);display:grid;place-items:center;flex:none;font-weight:800;font-size:.72rem;letter-spacing:.02em}
.inbox b{display:block}
.inbox span{font-size:.82rem;color:var(--muted)}
.inbox em{margin-left:auto;font-style:normal;font-weight:800;color:var(--accent);white-space:nowrap}
.hero{background:var(--accent);color:var(--on-acc);border-radius:20px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px}
.hero .lbl{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;opacity:.85;font-weight:700}
.hero .big{font-family:var(--f-display);font-weight:800;font-size:2.35rem;line-height:1;letter-spacing:-.02em}
.hero .row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.hero .row div{background:color-mix(in srgb,var(--on-acc) 13%,transparent);border-radius:12px;padding:8px 10px;min-width:0}
.hero .row b{display:block;font-size:.94rem;letter-spacing:-.01em;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero .row span{font-size:.7rem;opacity:.88}
.hero .bar{height:8px;border-radius:99px;background:color-mix(in srgb,var(--on-acc) 22%,transparent);overflow:hidden}
.hero .bar i{display:block;height:100%;background:var(--on-acc);border-radius:99px}
.hero .note{font-size:.8rem;opacity:.92}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px}
.card h2{font-size:1rem;font-weight:700;margin-bottom:8px;display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.card h2 em{white-space:nowrap;font-style:normal;font-family:var(--f-body);font-size:.8rem;color:var(--muted);font-weight:500}

.wk-num{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.wk-num b{font-family:var(--f-display);font-size:1.6rem;font-weight:800}
.wk-num span{color:var(--muted);font-size:.85rem}
.meter{height:10px;background:var(--sunk);border-radius:99px;overflow:hidden;margin-top:8px}
.meter i{display:block;height:100%;border-radius:99px;background:var(--good)}
.meter.w i{background:var(--warn)} .meter.b i{background:var(--bad)}
.chip{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--good-soft);color:var(--good);white-space:nowrap;border:0}
.chip.w{background:var(--warn-soft);color:var(--warn)} .chip.b{background:var(--bad-soft);color:var(--bad)}
.wk-list{display:flex;flex-direction:column;gap:6px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.wk-list div{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:.88rem}

.split{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.split div{background:var(--sunk);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.split span{font-size:.74rem;color:var(--muted);display:flex;align-items:center;gap:6px}
.split b{font-size:1.02rem}
.dot{width:8px;height:8px;border-radius:50%;flex:none}

.tabs{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--sunk);border-radius:12px;padding:4px;gap:4px}
.tabs button{border:0;background:none;padding:9px 2px;border-radius:9px;font-weight:600;font-size:.86rem;color:var(--muted);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgb(0 0 0/.08)}

.list{display:flex;flex-direction:column}
.item{cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px;padding:10px 2px;border:0;border-bottom:1px solid var(--line);background:none;text-align:left;width:100%}
.item:last-child{border-bottom:0}
.item .t{font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.item .v{font-weight:700;text-align:right}
.item .m{font-size:.78rem;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;min-width:0}
.item .s{text-align:right}
.tag{font-size:.68rem;font-weight:700;padding:1px 7px;border-radius:99px;border:1px solid currentColor}
.tag.ap{color:var(--ap)}
.day{font-size:.72rem;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700;padding-top:10px}
.empty{color:var(--muted);font-size:.9rem;padding:12px 2px}

.fx{display:grid;grid-template-columns:auto minmax(0,1fr) 104px auto;gap:6px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}
.fx input[type=text]{width:100%;min-width:0;border:1px solid transparent;background:none;border-radius:8px;padding:6px}
.fx input[type=text]:focus{border-color:var(--line);background:var(--sunk)}
.fx .val{text-align:right}
.fx input[type=checkbox]{width:20px;height:20px;accent-color:var(--accent)}
.x{border:0;background:none;color:var(--muted);width:32px;height:32px;border-radius:8px;font-size:1.15rem}
.x.armed{background:var(--bad-soft);color:var(--bad)}
.sum{display:flex;justify-content:space-between;padding-top:10px;font-weight:700}
.ghost{border:1px dashed var(--line);background:none;border-radius:10px;padding:10px;width:100%;color:var(--accent);font-weight:700;margin-top:8px}
.hint{font-size:.8rem;color:var(--muted);margin:6px 0 0}

.fab{position:fixed;left:0;right:0;bottom:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:linear-gradient(to top,var(--bg) 60%,transparent);display:flex;justify-content:center;pointer-events:none;z-index:4}
.fab button{pointer-events:auto;width:100%;max-width:528px;border:0;border-radius:14px;padding:15px;background:var(--fg);color:var(--bg);font-weight:700;font-size:1rem;box-shadow:0 6px 18px rgb(0 0 0/.18)}

.sheet-bg{position:fixed;inset:0;background:rgb(0 0 0/.42);display:flex;align-items:flex-end;justify-content:center;z-index:10}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:8px 16px calc(16px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:12px;max-height:93%;overflow:auto;overscroll-behavior:contain}
.grab{width:40px;height:4px;border-radius:99px;background:var(--line);margin:4px auto 2px;flex:none}
.sheet h2{font-size:1.2rem;font-weight:800}
.sheet h3{font-family:var(--f-display);font-size:1rem;margin:4px 0 0}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:.74rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=date],input[type=url],select{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:11px 12px;width:100%;font-size:16px;min-width:0}
.money{font-family:var(--f-display);font-weight:800;font-size:1.8rem!important;padding:10px 12px!important}
.seg{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.seg2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.seg3{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:6px}
.seg button,.seg2 button,.seg3 button{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:10px 2px;font-weight:600;font-size:.86rem}
.seg button[aria-pressed="true"],.seg2 button[aria-pressed="true"],.seg3 button[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
#lArea button[data-v="pessoal"][aria-pressed="true"]{background:var(--acc-p);border-color:var(--acc-p);color:var(--on-acc)}
#lArea button[data-v="merc"][aria-pressed="true"]{background:var(--acc-m);border-color:var(--acc-m);color:var(--on-acc)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--sunk);border-radius:10px;padding:10px 12px;font-size:.9rem}
.toggle input{width:22px;height:22px;accent-color:var(--accent)}
.acts{display:flex;gap:8px;flex-wrap:wrap}
.acts button{flex:1 1 auto;border-radius:12px;padding:13px;font-weight:700;border:1px solid var(--line);background:var(--sunk)}
.acts .pri{background:var(--accent);color:var(--on-acc);border-color:var(--accent)}
.acts .del{flex:0 0 auto;color:var(--bad)}
.acts .del.armed{background:var(--bad);color:#fff;border-color:var(--bad)}
.err{color:var(--bad);font-size:.85rem}
.ap-note{display:flex;gap:8px;align-items:center;background:var(--ap-soft);border-radius:10px;padding:9px 11px;font-size:.86rem}
.ap-note b{font-size:.68rem;letter-spacing:.06em;background:var(--ap);color:var(--bg);padding:2px 6px;border-radius:5px}
.status{display:flex;align-items:center;gap:8px;font-weight:700;font-size:.9rem}
.status i{width:10px;height:10px;border-radius:50%;background:var(--muted)}
.status.on i{background:var(--good)}
.box{border:1px solid var(--line);border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:10px}
.copyrow{display:flex;gap:8px;align-items:center}
.copyrow code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;background:var(--sunk);border-radius:8px;padding:9px 10px;font-size:.9rem}
.copyrow button,.small-btn{border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:9px 12px;font-weight:700;font-size:.86rem;white-space:nowrap}
details{border:1px solid var(--line);border-radius:12px;padding:0 12px}
details summary{padding:12px 0;font-weight:700;cursor:pointer}
details ol{margin:0 0 12px;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:.9rem}
details ol li b{font-weight:700}
pre{margin:0;background:var(--sunk);border-radius:10px;padding:10px;font-size:.72rem;line-height:1.4;overflow:auto;max-height:200px;white-space:pre}
.toast{position:fixed;left:50%;bottom:calc(90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:9px 16px;border-radius:99px;font-size:.88rem;font-weight:600;z-index:30;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.hero .big{font-size:2rem}.fx{grid-template-columns:auto minmax(0,1fr) 88px auto}.month span{min-width:66px}}
</style>
</head>
<body data-area="pessoal">
<div class="wrap">
  <header class="top">
    <h1><small id="nomeTopo">Mateus Torres</small>Minhas Finanças</h1>
    <div class="top-r">
      <div class="month">
        <button id="prev" aria-label="Mês anterior">‹</button>
        <span id="mlabel"></span>
        <button id="next" aria-label="Próximo mês">›</button>
      </div>
      <button class="gear" id="openCfg" aria-label="Ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
    </div>
  </header>

  <nav class="area" role="tablist" aria-label="Área">
    <button role="tab" id="area-pessoal" aria-selected="true"><i style="background:var(--acc-p)"></i>Pessoal</button>
    <button role="tab" id="area-merc" aria-selected="false"><i style="background:var(--acc-m)"></i>Mercadorias</button>
  </nav>

  <button class="inbox" id="inbox" hidden>
    <span class="ic">Pay</span>
    <span><b id="inboxT"></b><span id="inboxS"></span></span>
    <em>Detalhar ›</em>
  </button>

  <main id="view"></main>
</div>

<div class="fab"><button id="openAdd">+ Lançar</button></div>
<div class="sheet-bg" id="sheetBg" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="toast" id="toast" hidden></div>
<input type="file" id="bkFile" accept="application/json,.json" hidden>

<script>
(function(){
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const brl=n=>(+n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const brlS=n=>Math.abs(n)>=1000?(n<0?'-':'')+'R$ '+Math.round(Math.abs(n)).toLocaleString('pt-BR'):brl(n);
const fmt2=n=>(+n||0).toLocaleString('pt-BR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtN=n=>(+n||0).toLocaleString('pt-BR',{maximumFractionDigits:3});
// aceita "35,90", "R$ 1.234,56", "35.90", "R$35.9", números
function money(s){
  if(typeof s==='number')return isFinite(s)?Math.round(s*100)/100:NaN;
  s=String(s||'').replace(/[^\d.,-]/g,'');if(!s)return NaN;
  const lc=s.lastIndexOf(','),ld=s.lastIndexOf('.');let dec=-1;
  if(lc>=0&&ld>=0)dec=Math.max(lc,ld);
  else{const i=lc>=0?lc:ld;if(i>=0){const sep=s[i],cnt=s.split(sep).length-1,after=s.length-i-1;if(cnt===1&&(after!==3||sep===','))dec=i}}
  const n=dec>=0?parseFloat(s.slice(0,dec).replace(/[.,]/g,'')+'.'+s.slice(dec+1)):parseFloat(s.replace(/[.,]/g,''));
  return isFinite(n)?Math.round(n*100)/100:NaN;
}
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const fromIso=s=>{const[y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)};
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const DIAS=['dom','seg','ter','qua','qui','sex','sáb'];
const fmtDay=s=>{const d=fromIso(s);return d.getDate()+' '+MESES[d.getMonth()]};
const uid=p=>p+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const sum=(a,f=x=>x.valor)=>a.reduce((t,x)=>t+(+f(x)||0),0);
const FORMAS={credito:['Crédito','var(--credito)'],pix:['Pix','var(--pix)'],debito:['Débito','var(--debito)'],dinheiro:['Dinheiro','var(--dinheiro)']};
const CATS=['Lazer','Comida','Transporte','Compras','Saúde','Estudos','Assinaturas','Outros'];
const TIPOS={pessoal:[['gasto','Gasto'],['entrada','Entrada']],merc:[['compra','Compra'],['entrada','Entrada'],['ressarc','Ressarcimento']]};
const DESC_L={'pessoal:gasto':'O que foi','pessoal:entrada':'De onde veio','merc:compra':'Mercadoria ou fornecedor','merc:entrada':'Venda ou recebimento','merc:ressarc':'Quem vai ressarcir e por quê'};
const KEY='minhas-financas-v1';

function rnd(n){const a='abcdefghjkmnpqrstuvwxyz23456789';let s='';const r=new Uint32Array(n);crypto.getRandomValues(r);r.forEach(v=>s+=a[v%a.length]);return s}
function defaults(){return{
  config:{nome:'Mateus Torres',fixosP:[],fixosM:[],sync:{url:'',token:'mt-'+rnd(12),lastSync:null}},
  lanc:[],pagos:{},importados:[],backupEm:null}}
let S;
function load(){try{const d=JSON.parse(localStorage.getItem(KEY)||'null');if(d&&d.config&&Array.isArray(d.lanc)){const b=defaults();d.config=Object.assign(b.config,d.config);d.config.sync=Object.assign(b.config.sync,d.config.sync||{});return Object.assign(b,d)}}catch(e){}return defaults()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast('Não foi possível salvar neste aparelho')}}
S=load();
if(!S.config.ver||S.config.ver<2){
  const OLD='faculdade:2000|relogio:200|celular:533|academia:210|alimentacao:300';
  if((S.config.fixosP||[]).map(f=>f.id+':'+f.valor).join('|')===OLD)S.config.fixosP=[];
  S.config.ver=2;
}
save();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}

const today=new Date();
let cur=new Date(today.getFullYear(),today.getMonth(),1);
let area='pessoal',subP='gastos',subM='compras',lastForma='credito';
try{const a=localStorage.getItem(KEY+':area');if(a==='merc')area='merc'}catch(e){}
const mKey=()=>cur.getFullYear()+'-'+pad(cur.getMonth()+1);
const isCurMonth=()=>cur.getFullYear()===today.getFullYear()&&cur.getMonth()===today.getMonth();
const defDate=()=>isCurMonth()?iso(new Date()):iso(cur);
const lancMes=a=>S.lanc.filter(x=>!x.pendente&&x.area===a&&x.mes===mKey());
const pend=()=>S.lanc.filter(x=>x.pendente).sort((a,b)=>b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0));
const pagos=()=>S.pagos[mKey()]||{};

function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>el.hidden=true,2200)}
function arm(btn,fn,label){if(btn.classList.contains('armed')){fn();return}btn.classList.add('armed');const o=btn.textContent;btn.textContent=label||'Confirmar';setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent=o}},3000)}

// ================= RENDER =================
function render(){
  document.body.dataset.area=area;
  $('#area-pessoal').setAttribute('aria-selected',area==='pessoal');
  $('#area-merc').setAttribute('aria-selected',area==='merc');
  $('#nomeTopo').textContent=S.config.nome||'';$('#nomeTopo').hidden=!S.config.nome;
  $('#mlabel').textContent=MESES[cur.getMonth()]+' '+cur.getFullYear();
  const p=pend();const ib=$('#inbox');ib.hidden=!p.length;
  if(p.length){$('#inboxT').textContent=p.length+(p.length>1?' compras do Apple Pay':' compra do Apple Pay')+' para detalhar';$('#inboxS').textContent=brl(sum(p))+' · ainda fora das contas'}
  $('#view').innerHTML=area==='pessoal'?vPessoal():vMerc();
  try{localStorage.setItem(KEY+':area',area)}catch(e){}
}

function itemRow(x){
  const f=FORMAS[x.forma];
  const meta=[];
  if(x.tipo==='gasto'||x.tipo==='compra'){if(f)meta.push(`<span class="tag" style="color:${f[1]}">${f[0]}</span>`)}
  if(x.origem==='applepay')meta.push('<span class="tag ap">Apple Pay</span>');
  if(x.tipo==='gasto')meta.push(`<span>${esc(x.cat||'Outros')}</span>`);
  if(x.tipo==='compra'&&x.qtd)meta.push(`<span>${fmtN(x.qtd)} un · ${brl(x.valor/x.qtd)}/un</span>`);
  if(x.tipo==='entrada')meta.push('<span>Entrada</span>');
  if(x.tipo==='ressarc')meta.push('<span>Ressarcimento</span>');
  const neg=x.tipo==='gasto'||x.tipo==='compra';
  const right=x.tipo==='ressarc'?`<span class="s"><button class="chip ${x.status==='recebido'?'':'w'}" data-tg="${x.id}">${x.status==='recebido'?'Recebido':'A receber'}</button></span>`:'<span></span>';
  return `<div class="item" role="button" tabindex="0" data-ed="${x.id}"><span class="t">${esc(x.desc)}</span><span class="v" style="${neg?'':'color:var(--good)'}">${neg?'':'+ '}${brl(x.valor)}</span><span class="m">${meta.join('')}</span>${right}</div>`;
}
function listByDay(arr,emptyMsg){
  if(!arr.length)return `<div class="empty">${emptyMsg}</div>`;
  let last='',h='';
  [...arr].sort((a,b)=>b.data.localeCompare(a.data)||(b.criado||0)-(a.criado||0)).forEach(x=>{
    if(x.data!==last){last=x.data;const d=fromIso(x.data);h+=`<div class="day">${DIAS[d.getDay()]}, ${d.getDate()} ${MESES[d.getMonth()]}</div>`}
    h+=itemRow(x)});
  return `<div class="list">${h}</div>`;
}
function fixosHTML(key){
  const arr=S.config[key],pg=pagos();
  const rows=arr.map(f=>`<div class="fx" data-fk="${key}" data-fid="${f.id}"><input type="checkbox" id="pg-${f.id}" ${pg[f.id]?'checked':''} aria-label="Pago neste mês"><input type="text" id="fn-${f.id}" value="${esc(f.nome)}" aria-label="Nome"><input type="text" class="val" id="fv-${f.id}" inputmode="decimal" value="${fmt2(f.valor)}" aria-label="Valor"><button class="x" data-delfx="${f.id}" aria-label="Remover">×</button></div>`).join('');
  const pagoTot=sum(arr.filter(f=>pg[f.id]));
  return `${rows||`<div class="empty">Nenhum custo fixo cadastrado ainda. Toque em <b>+ Adicionar custo fixo</b> e coloque nome e valor de cada um.</div>`}
    <div class="sum"><span>Total fixo / mês</span><span>${brl(sum(arr))}</span></div>
    ${arr.length?`<div class="hint">Pago em ${MESES[cur.getMonth()]}: ${brl(pagoTot)} de ${brl(sum(arr))}</div>`:''}
    <button class="ghost" data-act="addfx" data-k="${key}">+ Adicionar custo fixo</button>
    <p class="hint">Os valores valem para todos os meses. Marque o quadrinho quando pagar.</p>`;
}
function tabs(cur,opts,attr){return `<nav class="tabs" role="tablist">${opts.map(([k,l])=>`<button role="tab" data-${attr}="${k}" aria-selected="${k===cur}">${l}</button>`).join('')}</nav>`}

function vPessoal(){
  const L=lancMes('pessoal'),g=L.filter(x=>x.tipo==='gasto'),e=L.filter(x=>x.tipo==='entrada');
  const totF=sum(S.config.fixosP),totV=sum(g),totR=sum(e),gasto=totF+totV,saldo=totR-gasto;
  const split=Object.entries(FORMAS).map(([k,[n,c]])=>`<div><span><i class="dot" style="background:${c}"></i>${n}</span><b>${brl(sum(g.filter(x=>x.forma===k)))}</b></div>`).join('');
  let body='';
  if(subP==='gastos')body=`<section class="card"><h2>Gastos do mês <em>${g.length?g.length+' lançamento'+(g.length>1?'s':''):''}</em></h2>${listByDay(g,'Nenhum gasto pessoal neste mês. Toque em <b>+ Lançar</b> para registrar.')}</section>`;
  if(subP==='fixos')body=`<section class="card"><h2>Custos fixos pessoais</h2>${fixosHTML('fixosP')}</section>`;
  if(subP==='entradas')body=`<section class="card"><h2>Entradas do mês <em>salário e extras</em></h2>${listByDay(e,'Nada recebido lançado neste mês. Toque em <b>+ Lançar</b> e escolha <b>Entrada</b> para colocar seu salário.')}<button class="ghost" data-act="nova" data-tipo="entrada">+ Lançar entrada</button></section>`;
  return `
  <section class="hero" aria-label="Resumo pessoal">
    <div><div class="lbl">Saldo pessoal do mês</div><div class="big">${brl(saldo)}</div></div>
    <div class="row"><div><span>Recebido</span><b>${brlS(totR)}</b></div><div><span>Fixos</span><b>${brlS(totF)}</b></div><div><span>Variáveis</span><b>${brlS(totV)}</b></div></div>
    <div class="bar"><i style="width:${totR>0?Math.min(100,gasto/totR*100):0}%"></i></div>
    <div class="note">${totR>0?'Total gasto: '+brl(gasto)+' · '+Math.round(gasto/totR*100)+'% do que entrou':'Total gasto: '+brl(gasto)+' · lance seu salário em Entradas'}</div>
  </section>
  <section class="card"><h2>Variáveis por forma de pagamento</h2><div class="split">${split}</div></section>
  ${tabs(subP,[['gastos','Gastos'],['fixos','Fixos'],['entradas','Entradas']],'sp')}
  ${body}`;
}

function vMerc(){
  const L=lancMes('merc'),c=L.filter(x=>x.tipo==='compra'),e=L.filter(x=>x.tipo==='entrada'),r=L.filter(x=>x.tipo==='ressarc');
  const totC=sum(c),totE=sum(e),totF=sum(S.config.fixosM),rRec=sum(r.filter(x=>x.status==='recebido'));
  const rPendAll=S.lanc.filter(x=>!x.pendente&&x.area==='merc'&&x.tipo==='ressarc'&&x.status!=='recebido');
  const res=totE+rRec-totC-totF;
  let body='';
  if(subM==='compras')body=`<section class="card"><h2>Compras de mercadoria <em>${c.length?c.length+' no mês':''}</em></h2>${listByDay(c,'Nenhuma compra de mercadoria neste mês. Toque em <b>+ Lançar</b>, escolha <b>Mercadorias</b> e <b>Compra</b>.')}${c.length?`<div class="sum"><span>Total em compras</span><span>${brl(totC)}</span></div>`:''}</section>`;
  if(subM==='fixos')body=`<section class="card"><h2>Custos fixos das mercadorias</h2>${fixosHTML('fixosM')}</section>`;
  if(subM==='entradas')body=`<section class="card"><h2>Entradas <em>vendas e recebimentos</em></h2>${listByDay(e,'Nenhuma entrada de mercadoria neste mês.')}<button class="ghost" data-act="nova" data-tipo="entrada">+ Lançar entrada</button></section>`;
  if(subM==='ressarc')body=`<section class="card"><h2>Ressarcimentos <em>toque no selo para marcar</em></h2>${listByDay(r,'Nenhum ressarcimento neste mês. Use para valores que alguém vai te devolver.')}<button class="ghost" data-act="nova" data-tipo="ressarc">+ Lançar ressarcimento</button></section>`;
  return `
  <section class="hero" aria-label="Resumo das mercadorias">
    <div><div class="lbl">Resultado das mercadorias</div><div class="big">${brl(res)}</div></div>
    <div class="row"><div><span>Entradas</span><b>${brlS(totE+rRec)}</b></div><div><span>Compras</span><b>${brlS(totC)}</b></div><div><span>Fixos</span><b>${brlS(totF)}</b></div></div>
    <div class="note">Entradas incluem ${brl(rRec)} de ressarcimentos recebidos no mês.</div>
  </section>
  ${rPendAll.length?`<section class="card" style="background:var(--warn-soft);border-color:transparent"><h2 style="margin:0"><span>Ressarcimentos a receber</span><span style="color:var(--warn)">${brl(sum(rPendAll))}</span></h2><div class="hint">${rPendAll.length} pendente${rPendAll.length>1?'s':''}, somando todos os meses</div></section>`:''}
  ${tabs(subM,[['compras','Compras'],['fixos','Fixos'],['entradas','Entradas'],['ressarc','Ressarc.']],'sm')}
  ${body}`;
}

// ================= EVENTOS DA TELA =================
const V=$('#view');
V.addEventListener('click',e=>{
  const t=e.target.closest('button,[data-ed]');if(!t)return;
  if(t.dataset.tg){e.stopPropagation();const x=S.lanc.find(z=>z.id===t.dataset.tg);x.status=x.status==='recebido'?'pendente':'recebido';save();render();toast(x.status==='recebido'?'Marcado como recebido':'Voltou para a receber');return}
  if(t.dataset.ed){openLanc(S.lanc.find(z=>z.id===t.dataset.ed));return}
  if(t.dataset.sp){subP=t.dataset.sp;render();return}
  if(t.dataset.sm){subM=t.dataset.sm;render();return}
  if(t.dataset.delfx){const k=t.closest('.fx').dataset.fk;arm(t,()=>{S.config[k]=S.config[k].filter(f=>f.id!==t.dataset.delfx);save();render()},'?');return}
  if(t.dataset.act==='addfx'){const k=t.dataset.k;const id='f'+Date.now().toString(36);S.config[k].push({id,nome:'Novo custo',valor:0});save();render();const el=document.getElementById('fn-'+id);if(el){el.focus();el.select()}return}
  if(t.dataset.act==='nova'){openLanc(null,{area,tipo:t.dataset.tipo});return}
});
V.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-ed]')){e.preventDefault();e.target.click()}});
V.addEventListener('change',e=>{
  const row=e.target.closest('.fx');if(!row)return;
  const f=S.config[row.dataset.fk].find(z=>z.id===row.dataset.fid);if(!f)return;
  if(e.target.type==='checkbox'){const k=mKey();S.pagos[k]=Object.assign({},S.pagos[k]);S.pagos[k][f.id]=e.target.checked;save();render();return}
  if(e.target.id==='fn-'+f.id){f.nome=e.target.value.trim()||f.nome;save();return}
  if(e.target.id==='fv-'+f.id){const v=money(e.target.value);if(isNaN(v)){e.target.value=fmt2(f.valor);return}f.valor=v;save();render()}
});

// ================= SHEETS =================
function openSheet(html,ready){const sh=$('#sheet');sh.innerHTML='<div class="grab"></div>'+html;$('#sheetBg').hidden=false;sh.scrollTop=0;ready&&ready(sh)}
function closeSheet(){$('#sheetBg').hidden=true;$('#sheet').innerHTML=''}
$('#sheetBg').addEventListener('click',e=>{if(e.target.id==='sheetBg')closeSheet()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheetBg').hidden)closeSheet()});

function guessForma(c){c=String(c||'');if(/d[ée]bito/i.test(c))return 'debito';return 'credito'}

function openLanc(item,preset){
  preset=preset||{};
  const st={area:item&&item.pendente?null:(item&&item.area||preset.area||area),tipo:item&&item.tipo||preset.tipo||null,forma:item&&item.forma||lastForma,status:item&&item.status||'pendente'};
  if(st.area&&(!st.tipo||!TIPOS[st.area].some(t=>t[0]===st.tipo)))st.tipo=st.area==='merc'?'compra':'gasto';
  const isPend=item&&item.pendente;
  const data=item&&item.data||defDate();
  const descVal=item?(item.desc||''):(st.tipo==='entrada'&&st.area==='pessoal'?'Salário':'');
  openSheet(`
    <h2>${isPend?'Detalhar compra':item?'Editar lançamento':'Novo lançamento'}</h2>
    ${item&&item.origem==='applepay'?`<div class="ap-note"><b>APPLE PAY</b><span>${esc(item.local||'Compra')}${item.cartao?' · '+esc(item.cartao):''}</span></div>`:''}
    <div class="field"><span class="flabel">${isPend?'Foi pessoal ou de mercadoria?':'Área'}</span><div class="seg2" id="lArea"><button type="button" data-v="pessoal">Pessoal</button><button type="button" data-v="merc">Mercadorias</button></div></div>
    <div class="field" id="wTipo"><span class="flabel">Tipo</span><div class="seg3" id="lTipo"></div></div>
    <div class="field"><label for="lVal">Valor (R$)</label><input type="text" id="lVal" class="money" inputmode="decimal" placeholder="0,00" value="${item?fmt2(item.valor):''}"></div>
    <div class="field"><label for="lDesc" id="lDescL">O que foi</label><input type="text" id="lDesc" value="${esc(descVal)}"></div>
    <div class="field" id="wQtd"><label for="lQtd">Quantidade (opcional)</label><input type="text" id="lQtd" inputmode="decimal" placeholder="Ex.: 12" value="${item&&item.qtd?fmtN(item.qtd):''}"></div>
    <div class="field" id="wForma"><span class="flabel">Pagou com</span><div class="seg" id="lForma">${Object.entries(FORMAS).map(([k,[n]])=>`<button type="button" data-v="${k}">${n}</button>`).join('')}</div></div>
    <div class="two"><div class="field"><label for="lData">Data</label><input type="date" id="lData" value="${data}"></div>
      <div class="field" id="wCat"><label for="lCat">Categoria</label><select id="lCat">${CATS.map(c=>`<option ${item&&item.cat===c?'selected':''}>${c}</option>`).join('')}</select></div></div>
    <div class="field" id="wStatus"><span class="flabel">Situação</span><div class="seg2" id="lStatus"><button type="button" data-v="pendente">A receber</button><button type="button" data-v="recebido">Recebido</button></div></div>
    <div class="err" id="lErr" hidden></div>
    <div class="acts">${item?`<button type="button" class="del" id="lDel">${isPend?'Ignorar':'Excluir'}</button>`:''}<button type="button" id="lCancel">Cancelar</button><button type="button" class="pri" id="lSave">Salvar</button></div>`,sh=>{
    const q=s=>sh.querySelector(s);
    const press=(box,v)=>box.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.v===v));
    function sync(){
      press(q('#lArea'),st.area);
      q('#wTipo').hidden=!st.area;
      if(!st.area){['#wQtd','#wForma','#wStatus'].forEach(k=>q(k).hidden=true);q('#wCat').style.visibility='hidden';q('#lDescL').textContent='O que foi';q('#lSave').style.background='';q('#lSave').style.borderColor='';return}
      if(!st.tipo||!TIPOS[st.area].some(t=>t[0]===st.tipo))st.tipo=TIPOS[st.area][0][0];
      q('#lTipo').innerHTML=TIPOS[st.area].map(([k,n])=>`<button type="button" data-v="${k}">${n}</button>`).join('');
      press(q('#lTipo'),st.tipo);press(q('#lForma'),st.forma);press(q('#lStatus'),st.status);
      q('#lDescL').textContent=DESC_L[st.area+':'+st.tipo];
      const dEl=q('#lDesc');
      if(st.area==='pessoal'&&st.tipo==='entrada'&&!dEl.value.trim()){dEl.value='Salário';dEl.dataset.auto='1'}
      else if(dEl.dataset.auto&&dEl.value==='Salário'&&!(st.area==='pessoal'&&st.tipo==='entrada')){dEl.value='';delete dEl.dataset.auto}
      q('#wQtd').hidden=st.tipo!=='compra';
      q('#wForma').hidden=!(st.tipo==='gasto'||st.tipo==='compra');
      q('#wCat').style.visibility=st.tipo==='gasto'?'visible':'hidden';
      q('#wStatus').hidden=st.tipo!=='ressarc';
      q('#lSave').style.background=st.area==='merc'?'var(--acc-m)':'var(--acc-p)';q('#lSave').style.borderColor=q('#lSave').style.background;
    }
    sync();
    q('#lArea').onclick=e=>{const b=e.target.closest('button');if(b){st.area=b.dataset.v;sync()}};
    q('#lTipo').onclick=e=>{const b=e.target.closest('button');if(b){st.tipo=b.dataset.v;sync()}};
    q('#lForma').onclick=e=>{const b=e.target.closest('button');if(b){st.forma=b.dataset.v;sync()}};
    q('#lStatus').onclick=e=>{const b=e.target.closest('button');if(b){st.status=b.dataset.v;sync()}};
    q('#lCancel').onclick=closeSheet;
    if(item)q('#lDel').onclick=e=>arm(e.target,()=>{S.lanc=S.lanc.filter(z=>z.id!==item.id);save();closeSheet();render();toast(isPend?'Compra ignorada':'Lançamento excluído');if(isPend&&pend().length)openInbox()},isPend?'Confirmar':'Confirmar');
    if(!item)setTimeout(()=>q('#lVal').focus(),60);
    q('#lSave').onclick=()=>{
      const err=q('#lErr'),v=money(q('#lVal').value),desc=q('#lDesc').value.trim(),dt=q('#lData').value;
      const fail=m=>{err.textContent=m;err.hidden=false};
      if(!st.area)return fail('Escolha se essa compra foi Pessoal ou de Mercadorias.');
      if(!(v>0))return fail('Digite um valor maior que zero, por exemplo 35,90.');
      if(!desc)return fail(st.tipo==='ressarc'?'Diga quem vai ressarcir.':'Escreva uma descrição curta.');
      if(!dt)return fail('Escolha a data.');
      let qtd=null;if(st.tipo==='compra'&&q('#lQtd').value.trim()){qtd=money(q('#lQtd').value);if(!(qtd>0))return fail('A quantidade precisa ser um número, por exemplo 12.')}
      const body={area:st.area,tipo:st.tipo,valor:v,desc,data:dt,mes:dt.slice(0,7),
        forma:(st.tipo==='gasto'||st.tipo==='compra')?st.forma:null,
        cat:st.tipo==='gasto'?q('#lCat').value:null,
        qtd,status:st.tipo==='ressarc'?st.status:null,pendente:false};
      if(body.forma)lastForma=body.forma;
      if(item){Object.assign(item,body)}else S.lanc.push(Object.assign({id:uid('l'),criado:Date.now()},body));
      save();closeSheet();
      area=st.area;if(body.mes!==mKey())cur=fromIso(body.mes+'-01');
      if(area==='pessoal')subP=st.tipo==='entrada'?'entradas':'gastos';else subM=st.tipo==='entrada'?'entradas':st.tipo==='ressarc'?'ressarc':'compras';
      render();toast(isPend?'Compra detalhada':item?'Lançamento atualizado':'Lançamento salvo');
      if(isPend&&pend().length)setTimeout(openInbox,350);
    };
  });
}

function openInbox(){
  const p=pend();
  if(!p.length){closeSheet();render();return}
  openSheet(`<h2>Compras para detalhar</h2>
    <p class="hint" style="margin:0">Chegaram pela automação do Apple Pay. Toque em cada uma e diga se foi pessoal ou de mercadoria. Até lá, elas não entram nas contas.</p>
    <div class="list">${p.map(x=>`<button class="item" data-pe="${x.id}"><span class="t">${esc(x.local||x.desc||'Compra')}</span><span class="v">${brl(x.valor)}</span><span class="m"><span class="tag ap">Apple Pay</span><span>${fmtDay(x.data)}${x.cartao?' · '+esc(x.cartao):''}</span></span><span></span></button>`).join('')}</div>
    <div class="acts"><button type="button" id="iSync">Buscar novas</button><button type="button" class="pri" id="iClose">Fechar</button></div>`,sh=>{
    sh.querySelectorAll('[data-pe]').forEach(b=>b.onclick=()=>openLanc(S.lanc.find(z=>z.id===b.dataset.pe)));
    sh.querySelector('#iClose').onclick=closeSheet;
    sh.querySelector('#iSync').onclick=async()=>{await syncAP(true);openInbox()};
  });
}

// ================= APPLE PAY (planilha Google) =================
let syncing=false,lastTry=0;
async function syncAP(manual){
  const c=S.config.sync;
  if(!c.url){if(manual)toast('Configure a automação em Ajustes');return false}
  if(syncing)return false;
  if(!manual&&Date.now()-lastTry<20000)return false;
  syncing=true;lastTry=Date.now();
  try{
    const u=c.url+(c.url.includes('?')?'&':'?')+'token='+encodeURIComponent(c.token)+'&t='+Date.now();
    const r=await fetch(u,{cache:'no-store'});
    let j;try{j=await r.json()}catch(e){throw new Error('o link não respondeu como esperado')}
    if(!j||!j.ok)throw new Error(j&&j.erro==='token'?'o código secreto não confere com o do script':'resposta inválida');
    const imp=new Set(S.importados);let novos=0;
    (j.itens||[]).forEach(it=>{
      if(!it||!it.id||imp.has(it.id))return;
      imp.add(it.id);
      const v=money(it.valor);let dt=new Date(it.quando);if(isNaN(dt))dt=new Date();const data=iso(dt);
      S.lanc.push({id:'ap-'+it.id,pendente:true,origem:'applepay',valor:isNaN(v)?0:v,desc:String(it.local||'Compra Apple Pay'),local:String(it.local||''),cartao:String(it.cartao||''),data,mes:data.slice(0,7),forma:guessForma(it.cartao),criado:Date.now()});
      novos++});
    S.importados=[...imp].slice(-3000);c.lastSync=Date.now();save();render();
    if(novos)toast(novos===1?'1 compra nova do Apple Pay':novos+' compras novas do Apple Pay');else if(manual)toast('Nenhuma compra nova');
    return true;
  }catch(e){if(manual)toast('Não consegui buscar: '+(e.message||'sem conexão'));return false}
  finally{syncing=false}
}
async function sendTest(){
  const c=S.config.sync;if(!c.url){toast('Cole o link do script primeiro');return}
  try{
    const r=await fetch(c.url,{method:'POST',body:JSON.stringify({token:c.token,valor:'R$ 1,00',local:'Teste do app',cartao:'Teste'})});
    let j=null;try{j=await r.json()}catch(e){}
    if(j&&j.ok===false)throw new Error(j.erro==='token'?'o código secreto não confere':'erro no script');
    toast('Compra de teste enviada');setTimeout(()=>syncAP(true),1200);
  }catch(e){toast('Não consegui enviar: '+(e.message||'sem conexão'))}
}

function scriptCode(token){return `// Ponte Apple Pay → Minhas Finanças
// Cole este código em Extensões > Apps Script da sua planilha.
const TOKEN = '${token}';

function aba_() {
  const ss = SpreadsheetApp.getActiveSpreadsheet();
  let sh = ss.getSheetByName('ApplePay');
  if (!sh) {
    sh = ss.insertSheet('ApplePay');
    sh.appendRow(['id', 'recebido_em', 'valor', 'local', 'cartao']);
    sh.setFrozenRows(1);
  }
  return sh;
}

function resposta_(obj) {
  return ContentService.createTextOutput(JSON.stringify(obj))
    .setMimeType(ContentService.MimeType.JSON);
}

// Recebe a compra enviada pelo Atalhos do iPhone
function doPost(e) {
  let dados = {};
  try { dados = JSON.parse((e && e.postData && e.postData.contents) || '{}'); } catch (err) {}
  dados = Object.assign({}, (e && e.parameter) || {}, dados);
  if (dados.token !== TOKEN) return resposta_({ ok: false, erro: 'token' });
  const id = Utilities.getUuid();
  aba_().appendRow([id, new Date(), "'" + String(dados.valor || ''),
    "'" + String(dados.local || ''), "'" + String(dados.cartao || '')]);
  return resposta_({ ok: true, id: id });
}

// Entrega as últimas compras para o app
function doGet(e) {
  const p = (e && e.parameter) || {};
  if (p.token !== TOKEN) return resposta_({ ok: false, erro: 'token' });
  const sh = aba_();
  const ultima = sh.getLastRow();
  if (ultima < 2) return resposta_({ ok: true, itens: [] });
  const inicio = Math.max(2, ultima - 299);
  const linhas = sh.getRange(inicio, 1, ultima - inicio + 1, 5).getValues();
  const itens = linhas.filter(r => r[0]).map(r => ({
    id: String(r[0]),
    quando: r[1] instanceof Date ? r[1].toISOString() : String(r[1]),
    valor: String(r[2]), local: String(r[3]), cartao: String(r[4])
  }));
  return resposta_({ ok: true, itens: itens });
}
`}

async function copyText(t,btn){
  try{await navigator.clipboard.writeText(t);toast('Copiado')}
  catch(e){const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();let ok=false;try{ok=document.execCommand('copy')}catch(_){}ta.remove();toast(ok?'Copiado':'Segure e copie manualmente')}
}

function openCfg(){
  const c=S.config.sync,on=!!c.url;
  openSheet(`<h2>Ajustes</h2>
    <div class="box">
      <h3>Compras do Apple Pay</h3>
      <div><div class="status ${on?'on':''}"><i></i>${on?'Link do script salvo':'Ainda não configurada'}</div>${c.lastSync?`<div class="hint" style="margin:2px 0 0 18px">Última busca: ${new Date(c.lastSync).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})}</div>`:''}</div>
      <div class="field"><label for="cUrl">Link do script (termina em /exec)</label><input type="url" id="cUrl" placeholder="https://script.google.com/macros/s/.../exec" value="${esc(c.url)}" autocomplete="off"></div>
      <div class="field"><label for="cTok">Código secreto (o mesmo do script e do Atalhos)</label><div class="copyrow"><input type="text" id="cTok" value="${esc(c.token)}" autocomplete="off" autocapitalize="off" spellcheck="false"><button type="button" id="cCopyTok">Copiar</button></div></div>
      <div class="acts"><button type="button" class="pri" id="cSave">Salvar link</button><button type="button" id="cTest">Testar</button><button type="button" id="cSend">Enviar teste</button></div>
      <details>
        <summary>Passo 1 · Criar a planilha e o script (no computador)</summary>
        <ol>
          <li>No computador, abra o link do app, entre em Ajustes e copie o código abaixo. Depois coloque o <b>mesmo código secreto</b> aqui no iPhone, no campo acima.</li>
          <li>Use a <b>sua conta Google pessoal</b>, não a da empresa. O mais seguro é abrir uma <b>janela anônima</b> (ou outro perfil do Chrome) e entrar só com ela, porque o Apps Script costuma dar erro quando há duas contas logadas ao mesmo tempo.</li>
          <li>Nessa janela, abra <b>sheets.new</b> e dê o nome <b>Finanças · Apple Pay</b>.</li>
          <li>Menu <b>Extensões → Apps Script</b>. Apague o que estiver lá e cole o código abaixo (já vem com o seu código secreto).</li>
          <li>Clique em <b>Implantar → Nova implantação</b>. Em tipo, escolha <b>App da Web</b>. Executar como: <b>Eu</b>. Quem pode acessar: <b>Qualquer pessoa</b>. Clique em <b>Implantar</b> e autorize com a <b>mesma conta pessoal</b> (se aparecer "o Google não verificou este app", toque em <b>Avançado → Acessar Finanças · Apple Pay (não seguro)</b>; é o seu próprio script).</li>
          <li>Copie o <b>URL do app da Web</b> (termina em <b>/exec</b>), cole no campo acima e toque em <b>Salvar link</b>. Depois toque em <b>Enviar teste</b>: deve aparecer uma compra de R$ 1,00 para detalhar.</li>
        </ol>
        <div class="copyrow" style="margin-bottom:8px"><span style="flex:1;font-size:.82rem;color:var(--muted)">Código do script</span><button type="button" id="cCopyCode">Copiar código</button></div>
        <pre id="cCode">${esc(scriptCode(c.token))}</pre>
        <div style="height:12px"></div>
      </details>
      <details>
        <summary>Passo 2 · Criar a automação no Atalhos (iPhone)</summary>
        <ol>
          <li>Abra o app <b>Atalhos</b> → aba <b>Automação</b> → <b>+</b> (Nova Automação).</li>
          <li>Escolha <b>Transação</b> (ícone da Wallet). Marque <b>todos os cartões</b>, todas as categorias e qualquer comerciante. Selecione <b>Executar Imediatamente</b> e toque em <b>Avançar</b>.</li>
          <li>Toque em <b>Nova Automação em Branco</b> → <b>Adicionar Ação</b> → busque <b>Obter Conteúdo do URL</b>.</li>
          <li>No campo URL, cole o <b>mesmo link do script</b>. Toque na setinha para mostrar mais: <b>Método: POST</b>, <b>Corpo da Solicitação: JSON</b>.</li>
          <li>Adicione 4 campos do tipo Texto:<br>
            <b>token</b> = o seu código secreto (botão Copiar acima)<br>
            <b>valor</b> = variável <b>Entrada do Atalho</b> → toque nela e escolha <b>Valor</b><br>
            <b>local</b> = <b>Entrada do Atalho</b> → <b>Comerciante</b><br>
            <b>cartao</b> = <b>Entrada do Atalho</b> → <b>Cartão ou Passe</b></li>
          <li>Toque em <b>OK</b>. Pronto: a cada compra por aproximação com o iPhone, ela vai para a planilha e aparece aqui para você detalhar.</li>
        </ol>
      </details>
    </div>
    <div class="box">
      <h3>Seu nome</h3>
      <div class="copyrow"><input type="text" id="cNome" value="${esc(S.config.nome||'')}" placeholder="Como quer aparecer no topo" aria-label="Seu nome" autocomplete="name"><button type="button" id="cNomeSave">Salvar</button></div>
      <p class="hint" style="margin:0">Aparece no topo do app. Deixe em branco para não mostrar nome.</p>
    </div>
    <div class="box">
      <h3>Backup dos dados</h3>
      <p class="hint" style="margin:0">Seus lançamentos ficam neste celular. Salve um backup de vez em quando (dá para mandar no WhatsApp ou Drive). Dá para restaurar também o backup do app antigo <b>Meus Gastos</b>.</p>
      <p class="hint" style="margin:0">${S.backupEm?'Último backup: '+new Date(S.backupEm).toLocaleDateString('pt-BR'):'Você ainda não fez nenhum backup.'}</p>
      <div class="acts"><button type="button" class="pri" id="bkExp">Salvar backup</button><button type="button" id="bkImp">Restaurar backup</button></div>
    </div>
    <div class="acts"><button type="button" id="cClose">Fechar</button></div>`,sh=>{
    const q=s=>sh.querySelector(s);
    q('#cCopyTok').onclick=()=>copyText(q('#cTok').value.trim());
    q('#cCopyCode').onclick=()=>copyText(scriptCode(c.token));
    const saveUrl=()=>{const u=q('#cUrl').value.trim(),tk=q('#cTok').value.trim();if(u&&!/^https:\/\/script\.google(usercontent)?\.com\//.test(u)){toast('Esse link não parece ser do Apps Script');return false}if(tk.length<6){toast('O código secreto precisa ter pelo menos 6 caracteres');return false}const mudou=tk!==c.token;c.url=u;c.token=tk;save();if(mudou)q('#cCode').textContent=scriptCode(tk);return true};
    q('#cSave').onclick=async()=>{if(!saveUrl())return;if(!c.url){toast('Link removido');openCfg();return}toast('Link salvo');await syncAP(true);openCfg()};
    q('#cTest').onclick=async()=>{if(!saveUrl())return;const ok=await syncAP(true);if(ok)toast('Conexão funcionando');openCfg()};
    q('#cSend').onclick=async()=>{if(!saveUrl())return;await sendTest()};
    sh.querySelector('#cClose').onclick=closeSheet;
    sh.querySelector('#cNomeSave').onclick=()=>{S.config.nome=sh.querySelector('#cNome').value.trim().slice(0,40);save();render();toast(S.config.nome?'Nome atualizado':'Nome removido')};
    sh.querySelector('#bkExp').onclick=exportBk;
    sh.querySelector('#bkImp').onclick=()=>$('#bkFile').click();
  });
}

async function exportBk(){
  S.backupEm=Date.now();save();
  const name='backup-financas-'+iso(new Date())+'.json';
  const file=new File([JSON.stringify(S)],name,{type:'application/json'});
  try{if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:'Backup Minhas Finanças'});toast('Backup salvo');return}}catch(e){if(e&&e.name==='AbortError')return}
  const a=document.createElement('a');a.href=URL.createObjectURL(file);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000);toast('Backup salvo');
}
function fromMeusGastos(d){
  const n=defaults();n.config.sync=S.config.sync;
  if(d.config){if(Array.isArray(d.config.fixos))n.config.fixosP=d.config.fixos.map(f=>({id:String(f.id),nome:f.nome,valor:+f.valor||0}));}
  (d.gastos||[]).forEach(g=>n.lanc.push({id:'mg-'+g.id,area:'pessoal',tipo:'gasto',valor:+g.valor||0,desc:g.descricao||'Gasto',data:g.data,mes:(g.data||'').slice(0,7),forma:g.forma||'pix',cat:g.categoria||'Outros',criado:g.criado||0,pendente:false}));
  Object.entries(d.months||{}).forEach(([k,m])=>{(m.entradas||[]).forEach(e=>n.lanc.push({id:'mg-'+e.id,area:'pessoal',tipo:'entrada',valor:+e.valor||0,desc:e.desc||'Entrada',data:e.data||k+'-01',mes:(e.data||k+'-01').slice(0,7),criado:0,pendente:false}));if(m.pagos)n.pagos[k]=Object.assign({},m.pagos)});
  return n;
}
$('#bkFile').onchange=async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(d&&d.config&&Array.isArray(d.lanc)){const b=defaults();d.config=Object.assign(b.config,d.config);d.config.sync=Object.assign(b.config.sync,d.config.sync||{});S=Object.assign(b,d)}
    else if(d&&d.config&&Array.isArray(d.gastos)){S=fromMeusGastos(d)}
    else throw 0;
    save();closeSheet();render();toast('Backup restaurado')}
  catch(err){toast('Arquivo inválido. Escolha um backup deste app ou do Meus Gastos.')}};
